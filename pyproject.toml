[project]
name = "dmc-competitor-finder"
version = "2.0.0"
description = "Find competitors selling the same travel package, with price comparison"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E731", "E701"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
